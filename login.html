<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TBGDZRZZEJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TBGDZRZZEJ');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your Oriental Destiny account to access your dream interpretations, BaZi report, and membership dashboard.">
    <meta property="og:title" content="Sign In | Oriental Destiny">
    <meta property="og:description" content="Access your personal destiny space — dream interpretations, BaZi report, and more.">
    <link rel="canonical" href="https://oriental-destiny.com/login.html">
    <title>Sign In | Oriental Destiny</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --ink: #241915;
            --paper: #f8f1e7;
            --cinnabar: #a63a2c;
            --gold: #b78a42;
            --pine: #315247;
            --line: rgba(36, 25, 21, 0.1);
            --shadow: 0 18px 48px rgba(70, 41, 24, 0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top, rgba(183, 138, 66, 0.14), transparent 40%),
                linear-gradient(180deg, #f5e7d6 0%, var(--paper) 42%, #fbf7f1 100%);
            line-height: 1.72;
            min-height: 100vh;
            display: flex; flex-direction: column;
        }
        a { color: inherit; text-decoration: none; }

        .topbar {
            position: sticky; top: 0; z-index: 10;
            backdrop-filter: blur(14px);
            background: rgba(248, 241, 231, 0.88);
            border-bottom: 1px solid rgba(36, 25, 21, 0.08);
        }
        .topbar-inner {
            max-width: 1120px; margin: 0 auto;
            padding: 0 20px; min-height: 68px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .brand { display: flex; flex-direction: column; gap: 2px; }
        .brand-mark { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cinnabar); }
        .brand-name { font-size: 22px; font-weight: 700; }
        .nav { display: flex; gap: 18px; font-size: 14px; color: rgba(36,25,21,0.78); flex-wrap: wrap; align-items: center; }
        .nav a:hover { color: var(--cinnabar); }

        .main {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 40px 20px;
        }
        .login-card {
            background: #fff; border-radius: 16px; padding: 48px 44px;
            max-width: 420px; width: 100%; text-align: center;
            box-shadow: var(--shadow);
        }
        .login-brand {
            font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
            color: var(--gold); margin-bottom: 12px;
        }
        .login-title { font-size: 28px; margin-bottom: 8px; color: var(--ink); font-weight: 700; }
        .login-subtitle { font-size: 15px; color: rgba(36,25,21,0.65); margin-bottom: 28px; line-height: 1.5; }

        .field { margin-bottom: 14px; }
        .field input {
            width: 100%; padding: 13px 16px;
            border: 1.5px solid var(--line); border-radius: 8px;
            font-family: Georgia, serif; font-size: 15px;
            color: var(--ink); background: var(--paper);
            outline: none; box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .field input:focus { border-color: var(--gold); }
        .error { color: var(--cinnabar); font-size: 13px; min-height: 18px; margin-bottom: 8px; text-align: left; }
        .success { color: #2e7d32; font-size: 13px; min-height: 18px; margin-bottom: 8px; text-align: left; }
        .submit-btn {
            width: 100%; padding: 14px;
            background: var(--cinnabar); color: #fff;
            border: none; border-radius: 8px;
            font-size: 16px; font-family: Georgia, serif; font-weight: 600;
            cursor: pointer; transition: background 0.2s; margin-bottom: 16px;
        }
        .submit-btn:hover { background: #8c2f23; }
        .submit-btn:disabled { background: #c4a882; cursor: not-allowed; }
        .toggle { font-size: 13px; color: rgba(36,25,21,0.6); }
        .toggle a { color: var(--cinnabar); text-decoration: underline; cursor: pointer; }

        .forgot { font-size: 12px; color: rgba(36,25,21,0.4); margin-top: 8px; }

        footer {
            border-top: 1px solid var(--line);
            padding: 32px 20px; text-align: center;
            font-size: 13px; color: rgba(36,25,21,0.5);
        }
        footer a { color: var(--cinnabar); }
        footer a:hover { text-decoration: underline; }

        @media (max-width: 500px) {
            .login-card { padding: 32px 24px; }
            .login-title { font-size: 24px; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a href="index.html" class="brand">
            <span class="brand-mark" data-i18n="login_brand_mark">Oriental Destiny</span>
            <span class="brand-name" data-i18n="login_brand_name">☯ Oriental Destiny</span>
        </a>
        <nav class="nav">
            <a href="index.html" data-i18n="login_nav_home">Home</a>
            <a href="dream-interpretation.html" data-i18n="login_nav_dream">Dream Interpreter</a>
            <a href="register.html" data-i18n="login_nav_signup">Sign Up</a>
        </nav>
    </div>
</header>

<div class="main">
    <div class="login-card">
        <div class="login-brand" data-i18n="login_card_brand">☯ Oriental Destiny</div>
        <h1 class="login-title" data-i18n="login_title">Welcome Back</h1>
        <p class="login-subtitle" data-i18n="login_subtitle">Sign in to access your dream history and dashboard</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="field">
                <input type="email" id="loginEmail" data-i18n-placeholder="login_placeholder_email" placeholder="Email address" autocomplete="email" required>
            </div>
            <div class="field">
                <input type="password" id="loginPassword" data-i18n-placeholder="login_placeholder_password" placeholder="Password" autocomplete="current-password" required>
            </div>
            <div class="error" id="loginError"></div>
            <div class="success" id="loginSuccess"></div>
            <button type="submit" class="submit-btn" id="loginBtn" data-i18n="login_btn">Sign In</button>
        </form>

        <p class="toggle"><span data-i18n="login_no_account">Don't have an account?</span> <a href="register.html" data-i18n="login_create_account">Create free account</a></p>
        <p class="forgot" data-i18n="login_forgot">If you forgot your password, please contact support.</p>
    </div>
</div>

<footer>
    <p><span data-i18n="login_footer_copyright">© 2026 Oriental Destiny</span> · <a href="index.html" data-i18n="login_footer_home">Home</a> · <a href="policies.html" data-i18n="login_footer_privacy">Privacy</a> · <span class="od-version"></span></p>
</footer>

<script src="i18n.js"></script>
<script src="config.real.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="version.js"></script>
<script>
(function() {
    var form = document.getElementById('loginForm');
    var btn = document.getElementById('loginBtn');
    var err = document.getElementById('loginError');
    var succ = document.getElementById('loginSuccess');

    function t(key, fallback) { return (window.I18n && window.I18n.t(key, fallback)) || fallback; }

    window.handleLogin = function(e) {
        e.preventDefault();
        var email = document.getElementById('loginEmail').value.trim();
        var password = document.getElementById('loginPassword').value;

        err.textContent = '';
        succ.textContent = '';

        if (!email || !password) { err.textContent = t('login_err_fill_all', 'Please fill in all fields.'); return; }

        btn.disabled = true;
        btn.textContent = t('login_signing_in', 'Signing in...');

        Auth.init().then(function() {
            return Auth.login(email, password);
        }).then(function() {
            succ.textContent = t('login_signed_in', 'Signed in! Redirecting...');
            var params = new URLSearchParams(window.location.search);
            var redirect = params.get('redirect') || 'dashboard.html';
            setTimeout(function() { window.location.href = redirect; }, 800);
        }).catch(function(error) {
            var msgs = {
                'auth/wrong-password': t('login_err_wrong_password', 'Incorrect password.'),
                'auth/user-not-found': t('login_err_no_user', 'No account found. Create one.'),
                'auth/invalid-email': t('login_err_invalid_email', 'Invalid email address.'),
                'auth/too-many-requests': t('login_err_too_many', 'Too many attempts. Please try again later.'),
                'auth/invalid-credential': t('login_err_invalid', 'Invalid email or password.')
            };
            err.textContent = msgs[error.code] || t('login_err_generic', 'Sign in failed. Please try again.');
            btn.disabled = false;
            btn.textContent = t('login_btn', 'Sign In');
        });
    };

    Auth.init();
})();
</script>

</body>
</html>
