<script>
const PROXY_URL = window.DEEPSEEK_PROXY_URL || "https://deepseek-proxy.qzwx10000.workers.dev";

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function paras(text) {
  if (!text) return '';
  return String(text).split(/\n\n/).filter(Boolean)
    .map(pp => '<p>'+esc(pp).replace(/\n/g,'<br>')+'</p>').join('\n');
}
function items(arr) {
  return (arr||[]).map((a,i) => `
    <li class="pocket-item" style="animation-delay:${i*0.15}s">
      <span class="pocket-num">${i+1}</span><span>${esc(a)}</span>
    </li>`).join('\n');
}

async function generateReport() {
  const btn = document.getElementById('generateBtn');
  const statusArea = document.getElementById('statusArea');
  const output = document.getElementById('output');

  btn.disabled = true;
  statusArea.innerHTML = `
    <div class="status-panel">
      <div class="phase">⚙️ 正在排盘...</div>
      <div class="detail">七层古典子平法计算中</div>
    </div>`;
  output.innerHTML = '';

  try {
    // ── Step 1: Calculate ──
    const profile = BaziEngineV2.calculateProfile({
      birthDate: document.getElementById('birthDate').value,
      birthTime: document.getElementById('birthTime').value,
      birthLocation: document.getElementById('birthLocation').value,
      gender: document.getElementById('gender').value,
      lifeFocus: document.getElementById('focus').value
    });

    statusArea.innerHTML = `
      <div class="status-panel">
        <div class="phase">📐 命盘已出 · ${profile.dayMaster}${profile.dayMasterElement}日主 · ${profile.geJu.patternName}</div>
        <div class="detail">正在请 AI 老师父为你解读...</div>
      </div>`;

    // ── Step 2: Generate Basic + Deluxe ──
    const engine = new ReportEngineV2({ proxyBaseURL: PROXY_URL });
    const focus = document.getElementById('focus').value;

    // Use the two-tier approach
    const basic = await engine.generateBasicReport(profile, focus);
    const deluxe = await engine.generateDeluxeReport(basic, profile, focus);

    if (deluxe.fallback) {
      statusArea.innerHTML = `
        <div class="status-panel error">
          <div class="phase">⚠️ AI 老师父暂时离线</div>
          <div class="detail">已使用古典算法直接生成命书——内容准确，但少了些温度</div>
        </div>`;
    } else {
      statusArea.innerHTML = `
        <div class="status-panel success">
          <div class="phase">✅ 天命书已生成</div>
          <div class="detail">${profile.dayMaster}${profile.dayMasterElement}日主 · 请往下翻阅你的命书</div>
        </div>`;
    }

    // ── Step 3: Render ──
    output.innerHTML = buildReportHTML(deluxe, profile);

    // Scroll to report
    setTimeout(() => {
      output.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 300);

  } catch(e) {
    statusArea.innerHTML = `
      <div class="status-panel error">
        <div class="phase">❌ 出错了：${esc(e.message)}</div>
        <div class="detail">请检查输入后重试</div>
      </div>`;
    console.error(e);

    // Fallback on error
    try {
      const profile = BaziEngineV2.calculateProfile({
        birthDate: document.getElementById('birthDate').value,
        birthTime: document.getElementById('birthTime').value,
        birthLocation: document.getElementById('birthLocation').value,
        gender: document.getElementById('gender').value,
        lifeFocus: document.getElementById('focus').value
      });
      const fallbackBasic = buildFallbackBasic(profile, document.getElementById('focus').value);
      const fallbackAnnotations = buildFallbackAnnotations(profile);
      const fallbackJewelry = buildFallbackJewelry(profile);
      const fallbackDeluxe = {
        basic: fallbackBasic,
        masterAnnotations: fallbackAnnotations,
        jewelryGuide: fallbackJewelry,
        fallback: true
      };
      output.innerHTML = buildReportHTML(fallbackDeluxe, profile);
    } catch(e2) {
      output.innerHTML = '<div class="content-card"><p>无法生成命书，请刷新页面后重试。</p></div>';
    }
  } finally {
    btn.disabled = false;
  }
}

// REPORT HTML BUILDER — matches gen_report.js style
// ══════════════════════════════════════════════════════════
function buildReportHTML(deluxe, profile) {
  const report = deluxe.basic || deluxe.report || {};
  const sn = buildChartSnapshot(profile);
  const elCounts = profile.elementCounts || {};
  const elNames = ['Wood','Fire','Earth','Metal','Water'];
  const elChinese = {Wood:'木',Fire:'火',Earth:'土',Metal:'金',Water:'水'};
  const elColorsA = {Wood:'#4a7c59',Fire:'#b5342a',Earth:'#c9a24e',Metal:'#8a8a8a',Water:'#2c3e6b'};
  const maxCount = Math.max(1, ...elNames.map(e => elCounts[e]||0));

  const elBarsHTML = elNames.map(e => {
    const pct = Math.round(((elCounts[e]||0)/maxCount)*100);
    return `<div class="el-bar-row">
      <span class="el-bar-label">${elChinese[e]} ${e}</span>
      <span class="el-bar-track"><span class="el-bar-fill" style="width:${pct}%;background:${elColorsA[e]}"></span></span>
      <span class="el-bar-val">${(elCounts[e]||0).toFixed(1)}</span>
    </div>`;
  }).join('\n');

  // Pillars
  const yr = sn.fourPillars.year.split(' · ');
  const mo = sn.fourPillars.month.split(' · ');
  const dy = sn.fourPillars.day.split(' · ');
  const hr = sn.fourPillars.hour.split(' · ');
  const pillarsHTML = `
    <div class="bazi-table">
      <div class="bazi-col"><span class="bazi-stem">${yr[0].slice(0,-2)}</span><span class="bazi-branch">${yr[0].slice(-2)}</span><span class="bazi-label">年柱 Year</span><span class="bazi-nayin">${yr[1]||''}</span></div>
      <div class="bazi-col"><span class="bazi-stem">${mo[0].slice(0,-2)}</span><span class="bazi-branch">${mo[0].slice(-2)}</span><span class="bazi-label">月柱 Month</span><span class="bazi-nayin">${mo[1]||''}</span></div>
      <div class="bazi-col day-master"><span class="bazi-stem">${dy[0].slice(0,-2)}</span><span class="bazi-branch">${dy[0].slice(-2)}</span><span class="bazi-label">日柱 Day</span><span class="bazi-dm">日主</span></div>
      <div class="bazi-col"><span class="bazi-stem">${hr[0].slice(0,-2)}</span><span class="bazi-branch">${hr[0].slice(-2)}</span><span class="bazi-label">时柱 Hour</span><span class="bazi-nayin">${hr[1]||''}</span></div>
    </div>`;

  const tagsHTML = `
    <span class="chip gold">${esc(sn.pattern)}</span>
    <span class="chip gold">用神: ${esc(sn.yongShen)}</span>
    <span class="chip gold">喜神: ${esc(sn.xiShen)}</span>
    <span class="chip red">忌神: ${esc(sn.jiShen)}</span>
    <span class="chip green">${esc(sn.strength)}</span>`;

  // Annotations
  const annotationsHTML = (deluxe.masterAnnotations||[]).map((a,i) => `
    <div class="tianji-scroll" style="animation-delay:${i*0.2}s">
      <div class="tianji-header">
        <span class="tianji-seal">天机</span>
        <span class="tianji-num">第${['一','二','三','四','五'][i]||(i+1)}道</span>
      </div>
      <h3>${esc(a.title)}</h3>
      <div class="tianji-body">${esc(a.insight)}</div>
    </div>
  `).join('\n');

  // Jewelry
  const jg = deluxe.jewelryGuide;
  const jewelryHTML = jg ? `
    <div class="crystal-grid">
      <div class="crystal-card primary">
        <div class="crystal-badge">本命灵石</div>
        <div class="crystal-stone">${esc(jg.primaryCrystal?.name||'')}</div>
        <span class="crystal-element">${esc(jg.primaryCrystal?.element||'')} 元素</span>
        <p class="crystal-why">${esc(jg.primaryCrystal?.whyForThisChart||'')}</p>
        <p class="crystal-wear">${esc(jg.primaryCrystal?.wearingGuidance||'')}</p>
      </div>
      <div class="crystal-card secondary">
        <div class="crystal-badge sec">护法灵玉</div>
        <div class="crystal-stone">${esc(jg.secondaryCrystal?.name||'')}</div>
        <span class="crystal-element">${esc(jg.secondaryCrystal?.element||'')} 元素</span>
        <p class="crystal-why">${esc(jg.secondaryCrystal?.whyForThisChart||'')}</p>
        <p class="crystal-wear">${esc(jg.secondaryCrystal?.wearingGuidance||'')}</p>
      </div>
    </div>
    <div class="crystal-master-note">
      <p class="master-words">${esc(jg.masterNote||'')}</p>
      <p class="crystal-avoid">⚠ ${esc(jg.whatToAvoid||'')}</p>
    </div>
  ` : '';

  return `
<section class="chapter">
  <div style="text-align:center;padding:20px 0;">
    <div class="seal-anim"><div class="seal-inner">天命</div></div>
    <h1 style="font-size:clamp(28px,5vw,40px);font-weight:900;margin:20px 0 10px;letter-spacing:0.03em;">
      ${esc(profile.dayMaster)}<span style="color:var(--cinnabar);">${esc(profile.dayMasterElement)}</span>命主
    </h1>
    <p style="font-size:15px;color:var(--ink-light);">${esc(profile.pillars.month.branch)}月 · ${esc(profile.season)} · ${esc(sn.pattern)}</p>
    <div style="width:80px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto;"></div>
    <span style="display:inline-block;padding:6px 20px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.08em;background:linear-gradient(135deg,var(--cinnabar),var(--cinnabar-deep));color:#fff;">✦ 天命书 · 八字命理解读</span>
  </div>
</section>

<section class="chapter">
  <div class="content-card chart-card">
    <div class="chart-title">命盘总览 Chart Overview</div>
    ${pillarsHTML}
    <div class="chip-row">${tagsHTML}</div>
    <div class="shensha-line">
      神煞: ${esc(sn.shenSha)} · 起运: ${esc(sn.qiYun)} · 大运: ${esc(sn.currentDaYun)}
    </div>
    <div class="el-bars">${elBarsHTML}</div>
  </div>
</section>

<section class="chapter">
  <div class="chapter-marker"><span class="vol">卷一</span><span class="title-cn">命主画像</span><span class="title-en">Who You Are</span></div>
  <div class="content-card">${paras(report.opening)}</div>
</section>

<section class="chapter">
  <div class="chapter-marker"><span class="vol">卷二</span><span class="title-cn">格局解密</span><span class="title-en">Your Pattern</span></div>
  <div class="content-card">${paras(report.yourPattern || report.thePattern)}</div>
</section>

<section class="chapter">
  <div class="chapter-marker"><span class="vol">卷三</span><span class="title-cn">天命所向</span><span class="title-en">Your Compass</span></div>
  <div class="content-card guides">${paras(report.whatGuidesYou || report.whatHelps)}</div>
</section>

<section class="chapter">
  <div class="chapter-marker"><span class="vol">卷四</span><span class="title-cn">行事锦囊</span><span class="title-en">In Practice</span></div>
  <div class="content-card">
    <ul class="pocket-list">${items(report.practicalSteps || report.whatToDo)}</ul>
  </div>
</section>

${annotationsHTML ? `
<section class="chapter">
  <div class="chapter-marker"><span class="vol">卷五</span><span class="title-cn">大师批注</span><span class="title-en">Master Notes</span></div>
  ${annotationsHTML}
</section>` : ''}

${jewelryHTML ? `
<section class="chapter">
  <div class="chapter-marker"><span class="vol">卷六</span><span class="title-cn">护身灵石</span><span class="title-en">Crystal Guide</span></div>
  <div class="content-card">${jewelryHTML}</div>
</section>` : ''}

<section class="chapter">
  <div class="content-card closing-card">${paras(report.closingWords || report.closing)}</div>
</section>`;
}

// Scroll progress
(function(){
  var fill = document.getElementById('scrollFill');
  window.addEventListener('scroll', function(){
    var h = document.documentElement;
    var pct = h.scrollHeight > h.clientHeight
      ? Math.round((h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100) : 0;
    fill.style.width = pct + '%';
  }, {passive:true});
})();
</script>
