<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image Generator — Oriental Destiny</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
        }
        .canvas-wrapper {
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .og-image {
            width: 1200px;
            height: 630px;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(ellipse 60% 50% at 50% 0%, rgba(200,90,60,0.35), transparent 55%),
                radial-gradient(ellipse 50% 40% at 15% 85%, rgba(180,120,40,0.28), transparent 45%),
                radial-gradient(ellipse 45% 35% at 88% 78%, rgba(160,60,40,0.20), transparent 40%),
                linear-gradient(175deg, #f3d5c0 0%, #f5e0cc 25%, #f8ece0 50%, #fbf5ee 75%, #fdfaf5 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Subtle rice-paper grain */
        .og-image::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            opacity: 0.5;
            pointer-events: none;
            mix-blend-mode: multiply;
        }

        /* Taiji (yin-yang) — large, translucent, centered behind text */
        .taiji {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(15deg);
            width: 520px;
            height: 520px;
            opacity: 0.10;
            pointer-events: none;
            z-index: 1;
        }

        /* Soft ring around Taiji */
        .taiji-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 560px;
            height: 560px;
            border: 1px solid rgba(166,58,44,0.14);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        /* Eight trigram ticks around the ring */
        .trigram {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }
        .t-mark {
            position: absolute;
            width: 2px;
            height: 12px;
            background: rgba(166,58,44,0.22);
            left: 50%;
            top: 0;
            transform-origin: 50% 300px;
        }
        .t-mark:nth-child(1)  { transform: translateX(-50%) rotate(0deg); }
        .t-mark:nth-child(2)  { transform: translateX(-50%) rotate(45deg); }
        .t-mark:nth-child(3)  { transform: translateX(-50%) rotate(90deg); }
        .t-mark:nth-child(4)  { transform: translateX(-50%) rotate(135deg); }
        .t-mark:nth-child(5)  { transform: translateX(-50%) rotate(180deg); }
        .t-mark:nth-child(6)  { transform: translateX(-50%) rotate(225deg); }
        .t-mark:nth-child(7)  { transform: translateX(-50%) rotate(270deg); }
        .t-mark:nth-child(8)  { transform: translateX(-50%) rotate(315deg); }

        /* Corner lattice — traditional window frame */
        .corner-tl, .corner-tr, .corner-bl, .corner-br {
            position: absolute;
            width: 56px;
            height: 56px;
            pointer-events: none;
            z-index: 3;
        }
        .corner-tl { top: 36px; left: 36px; border-top: 2.5px solid rgba(166,58,44,0.42); border-left: 2.5px solid rgba(166,58,44,0.42); }
        .corner-tr { top: 36px; right: 36px; border-top: 2.5px solid rgba(166,58,44,0.42); border-right: 2.5px solid rgba(166,58,44,0.42); }
        .corner-bl { bottom: 36px; left: 36px; border-bottom: 2.5px solid rgba(166,58,44,0.42); border-left: 2.5px solid rgba(166,58,44,0.42); }
        .corner-br { bottom: 36px; right: 36px; border-bottom: 2.5px solid rgba(166,58,44,0.42); border-right: 2.5px solid rgba(166,58,44,0.42); }

        .corner-tl::after, .corner-tr::after, .corner-bl::after, .corner-br::after {
            content: "";
            position: absolute;
            width: 34px;
            height: 34px;
        }
        .corner-tl::after { top: 8px; left: 8px; border-top: 1px solid rgba(183,138,66,0.32); border-left: 1px solid rgba(183,138,66,0.32); }
        .corner-tr::after { top: 8px; right: 8px; border-top: 1px solid rgba(183,138,66,0.32); border-right: 1px solid rgba(183,138,66,0.32); }
        .corner-bl::after { bottom: 8px; left: 8px; border-bottom: 1px solid rgba(183,138,66,0.32); border-left: 1px solid rgba(183,138,66,0.32); }
        .corner-br::after { bottom: 8px; right: 8px; border-bottom: 1px solid rgba(183,138,66,0.32); border-right: 1px solid rgba(183,138,66,0.32); }

        .content {
            position: relative;
            z-index: 2;
            padding: 0 100px;
        }

        /* Seal stamp */
        .seal {
            display: inline-block;
            width: 54px;
            height: 54px;
            background: rgba(166,58,44,0.10);
            border: 2.5px solid rgba(166,58,44,0.50);
            border-radius: 5px;
            margin-bottom: 18px;
            position: relative;
        }
        .seal::after {
            content: "命";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 26px;
            color: rgba(166,58,44,0.60);
            font-weight: 700;
            font-family: "Songti SC", "SimSun", serif;
        }

        .brand-mark {
            font-size: 15px;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: #a63a2c;
            margin-bottom: 14px;
            font-weight: 600;
        }

        .brand-name {
            font-size: 68px;
            font-weight: 700;
            color: #241915;
            line-height: 1.12;
            margin-bottom: 22px;
            letter-spacing: 0.04em;
        }

        .tagline {
            font-size: 24px;
            color: rgba(36,25,21,0.72);
            font-style: italic;
            margin-bottom: 36px;
            line-height: 1.45;
        }

        .divider {
            width: 64px;
            height: 2.5px;
            background: #b78a42;
            margin: 0 auto 32px;
            opacity: 0.75;
            border-radius: 1px;
        }

        .cta {
            display: inline-block;
            font-size: 16px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #a63a2c;
            font-weight: 600;
            border: 2px solid rgba(166,58,44,0.32);
            padding: 14px 38px;
            border-radius: 4px;
            background: rgba(255,255,255,0.35);
        }

        .url {
            position: absolute;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(36,25,21,0.40);
            z-index: 2;
        }

        /* Vertical decorative text */
        .vert-deco {
            position: absolute;
            writing-mode: vertical-rl;
            font-size: 13px;
            letter-spacing: 0.25em;
            color: rgba(166,58,44,0.20);
            font-weight: 600;
            pointer-events: none;
            z-index: 2;
        }
        .vert-left  { left: 48px; top: 50%; transform: translateY(-50%); }
        .vert-right { right: 48px; top: 50%; transform: translateY(-50%) rotate(180deg); }
    </style>
</head>
<body>
    <div class="canvas-wrapper">
        <div class="og-image">
            <!-- Taiji SVG — translucent, centered -->
            <svg class="taiji" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Outer circle outline -->
                <circle cx="100" cy="100" r="98" fill="none" stroke="#a63a2c" stroke-width="1.5" opacity="0.35"/>

                <!-- Left half (dark / yin) — warm ink -->
                <path d="M100,2 A98,98 0 0,1 100,198 A49,49 0 0,1 100,100 A49,49 0 0,0 100,2 Z"
                      fill="#241915" opacity="0.14"/>

                <!-- Right half (light / yang) — warm gold -->
                <path d="M100,2 A98,98 0 0,0 100,198 A49,49 0 0,0 100,100 A49,49 0 0,1 100,2 Z"
                      fill="#b78a42" opacity="0.16"/>

                <!-- Dark dot inside light -->
                <circle cx="100" cy="74" r="16" fill="#241915" opacity="0.14"/>

                <!-- Light dot inside dark -->
                <circle cx="100" cy="126" r="16" fill="#b78a42" opacity="0.16"/>
            </svg>

            <div class="taiji-ring"></div>

            <div class="trigram">
                <div class="t-mark"></div>
                <div class="t-mark"></div>
                <div class="t-mark"></div>
                <div class="t-mark"></div>
                <div class="t-mark"></div>
                <div class="t-mark"></div>
                <div class="t-mark"></div>
                <div class="t-mark"></div>
            </div>

            <div class="corner-tl"></div>
            <div class="corner-tr"></div>
            <div class="corner-bl"></div>
            <div class="corner-br"></div>

            <div class="vert-deco vert-left">東方命理</div>
            <div class="vert-deco vert-right">天人合一</div>

            <div class="content">
                <div class="seal"></div>
                <div class="brand-mark">Oriental Destiny</div>
                <h1 class="brand-name">Personalized<br>Feng Shui Reading</h1>
                <p class="tagline">Your birth chart matched to the exact direction<br>before your bracelet ever ships.</p>
                <div class="divider"></div>
                <div class="cta">Free Instant Preview</div>
            </div>

            <div class="url">oriental-destiny.com</div>
        </div>
    </div>
</body>
</html>
