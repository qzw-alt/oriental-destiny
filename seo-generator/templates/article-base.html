<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TBGDZRZZEJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TBGDZRZZEJ');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{META_DESCRIPTION}}">
    <link rel="canonical" href="https://oriental-destiny.com/{{CANONICAL_URL}}">
    <meta property="og:title" content="{{OG_TITLE}}">
    <meta property="og:description" content="{{OG_DESCRIPTION}}">
    <meta property="og:type" content="website">
    <title>{{PAGE_TITLE}} | Oriental Destiny</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": "{{JSONLD_HEADLINE}}",
      "description": "{{JSONLD_DESCRIPTION}}",
      "author": { "@type": "Organization", "name": "Oriental Destiny" },
      "publisher": {
        "@type": "Organization",
        "name": "Oriental Destiny",
        "url": "https://oriental-destiny.com/"
      },
      "mainEntityOfPage": "https://oriental-destiny.com/{{CANONICAL_URL}}"
    }
    </script>
    <style>
        :root {
            --ink: #241915; --paper: #f8f1e7; --cinnabar: #a63a2c;
            --gold: #b78a42; --pine: #315247; --line: rgba(36, 25, 21, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            background: {{BODY_BG}};
            line-height: 1.72;
        }
        a { color: var(--cinnabar); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .container { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
        .topbar {
            position: sticky; top: 0; z-index: 10;
            backdrop-filter: blur(14px);
            background: rgba(248, 241, 231, 0.88);
            border-bottom: 1px solid rgba(36, 25, 21, 0.08);
        }
        .topbar-inner {
            min-height: 74px; display: flex; align-items: center;
            justify-content: space-between; gap: 18px; flex-wrap: wrap;
        }
        .brand { display: flex; flex-direction: column; gap: 2px; }
        .brand-mark { font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cinnabar); }
        .brand-name { font-size: 24px; font-weight: 700; }
        .nav { display: flex; gap: 18px; font-size: 14px; color: rgba(36, 25, 21, 0.78); flex-wrap: wrap; justify-content: flex-end; }
        .nav a { color: inherit; }
        .nav a:hover { color: var(--cinnabar); text-decoration: none; }

        article { max-width: 720px; margin: 0 auto; padding: 56px 0 80px; }
        .article-header { margin-bottom: 40px; padding-bottom: 32px; border-bottom: 1px solid var(--line); }
        .article-label { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cinnabar); font-family: Georgia, serif; margin-bottom: 16px; }
        h1 {
            font-family: Georgia, serif; font-size: clamp(26px, 5vw, 40px);
            font-weight: 700; line-height: 1.18; color: var(--ink);
            margin-bottom: 20px;
        }
        .article-meta { font-size: 14px; color: rgba(36, 25, 21, 0.55); margin-top: 16px; }

        .article-body { font-size: 17px; }
        .article-body p { margin-bottom: 24px; }
        .article-body h2 {
            font-family: Georgia, serif; font-size: 26px; font-weight: 700;
            margin: 48px 0 20px; color: var(--ink); line-height: 1.3;
        }
        .article-body h3 {
            font-family: Georgia, serif; font-size: 20px; font-weight: 600;
            margin: 32px 0 16px; color: var(--ink);
        }
        .article-body ul, .article-body ol { margin: 0 0 24px 28px; }
        .article-body li { margin-bottom: 10px; }
        .article-body strong { color: var(--ink); font-weight: 600; }

        .element-banner {
            background: {{BANNER_GRADIENT}};
            color: #fff5f3;
            border-radius: 12px;
            padding: 32px;
            margin: 28px 0;
            display: flex; align-items: center; gap: 24px;
        }
        .element-banner .icon { font-size: 56px; line-height: 1; }
        .element-banner .text h3 { font-size: 20px; margin-bottom: 8px; }
        .element-banner .text p { font-size: 15px; opacity: 0.9; margin: 0; }

        .trait-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px; margin: 24px 0;
        }
        .trait-card {
            background: {{TRAIT_CARD_BG}};
            border: 1px solid {{TRAIT_CARD_BORDER}};
            border-radius: 10px; padding: 16px; text-align: center;
        }
        .trait-card .trait-icon { font-size: 24px; margin-bottom: 6px; }
        .trait-card .trait-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .trait-card .trait-desc { font-size: 13px; color: rgba(36,25,21,0.65); }

        .strength-weakness {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 28px 0;
        }
        .sw-box {
            border-radius: 10px; padding: 22px;
        }
        .sw-box.strength {
            background: {{STRENGTH_BG}};
            border: 1px solid {{STRENGTH_BORDER}};
        }
        .sw-box.weakness {
            background: rgba(183,138,66,0.07);
            border: 1px solid rgba(183,138,66,0.2);
        }
        .sw-box h4 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
        .sw-box.strength h4 { color: var(--cinnabar); }
        .sw-box.weakness h4 { color: #7a5a10; }
        .sw-box ul { margin: 0; list-style: none; padding: 0; }
        .sw-box ul li { font-size: 15px; padding: 4px 0; }
        .sw-box.strength ul li::before { content: "✓ "; color: var(--cinnabar); font-weight: 600; }
        .sw-box.weakness ul li::before { content: "× "; color: #7a5a10; font-weight: 600; }

        .career-table { width: 100%; border-collapse: collapse; margin: 28px 0; font-size: 15px; }
        .career-table th { background: var(--cinnabar); color: white; padding: 12px 16px; text-align: left; }
        .career-table td { padding: 12px 16px; border-bottom: 1px solid var(--line); }
        .career-table tr:nth-child(even) td { background: rgba(166,58,44,0.05); }

        .years-table { width: 100%; border-collapse: collapse; margin: 28px 0; font-size: 15px; }
        .years-table th { background: var(--pine); color: white; padding: 12px 16px; text-align: left; }
        .years-table td { padding: 12px 16px; border-bottom: 1px solid var(--line); }
        .years-table tr:nth-child(even) td { background: rgba(49,82,71,0.05); }

        .lucky-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px; margin: 24px 0;
        }
        .lucky-card {
            background: rgba(183,138,66,0.08);
            border: 1px solid rgba(183,138,66,0.2);
            border-radius: 10px; padding: 20px; text-align: center;
        }
        .lucky-card .lucky-icon { font-size: 28px; margin-bottom: 8px; }
        .lucky-card .lucky-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 6px; }
        .lucky-card .lucky-value { font-size: 16px; font-weight: 600; }

        .compat-card {
            border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px;
            margin: 14px 0; display: flex; align-items: center; gap: 16px;
        }
        .compat-card.excellent { border-left: 4px solid var(--pine); }
        .compat-card.good { border-left: 4px solid var(--gold); }
        .compat-card.challenging { border-left: 4px solid var(--cinnabar); }
        .compat-card .compat-rating {
            font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em;
            font-weight: 600; min-width: 90px;
        }
        .compat-card.excellent .compat-rating { color: var(--pine); }
        .compat-card.good .compat-rating { color: var(--gold); }
        .compat-card.challenging .compat-rating { color: var(--cinnabar); }

        .fortune-section {
            background: rgba(183,138,66,0.06);
            border: 1px solid rgba(183,138,66,0.15);
            border-radius: 12px; padding: 28px; margin: 32px 0;
        }
        .fortune-section h2 { margin-top: 0; }
        .fortune-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
            margin-top: 20px;
        }
        .fortune-card {
            background: white; border-radius: 8px; padding: 18px;
            border: 1px solid var(--line);
        }
        .fortune-card .fortune-label {
            font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--cinnabar); margin-bottom: 8px; font-weight: 600;
        }

        .element-pair { border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin: 20px 0; }
        .element-pair .pair-label { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--cinnabar); margin-bottom: 8px; font-weight: 600; }
        .element-pair .pair-icon { font-size: 20px; vertical-align: middle; margin-right: 6px; }
        .element-pair .pair-desc { font-size: 15px; color: rgba(36,25,21,0.8); margin: 0; }

        .key-point {
            background: rgba(183,138,66,0.07);
            border-left: 3px solid var(--gold);
            padding: 18px 22px; margin: 24px 0; border-radius: 0 8px 8px 0;
        }
        .key-point p { margin: 0; font-size: 16px; }

        .cta-box {
            background: linear-gradient(135deg, var(--ink), #3a2a1a);
            color: var(--paper); border-radius: 12px;
            padding: 36px 32px; margin: 48px 0;
            text-align: center;
        }
        .cta-box h2 { font-family: Georgia, serif; font-size: 26px; margin-bottom: 12px; color: var(--gold); }
        .cta-box p { font-size: 16px; opacity: 0.85; margin-bottom: 24px; }
        .cta-box a {
            display: inline-block; background: var(--gold); color: var(--ink);
            padding: 14px 32px; border-radius: 8px;
            font-weight: 600; font-size: 15px;
        }
        .cta-box a:hover { background: #c99a4e; text-decoration: none; }

        .faq-section { margin-top: 48px; }
        .faq-item { border-bottom: 1px solid var(--line); padding: 20px 0; }
        .faq-item h3 { font-size: 17px; font-weight: 600; margin-bottom: 10px; color: var(--ink); }
        .faq-item p { font-size: 16px; color: rgba(36,25,21,0.8); margin: 0; }

        footer {
            background: var(--ink); color: rgba(248, 241, 231, 0.7);
            padding: 40px 0; margin-top: 80px;
        }
        .footer-inner { display: flex; flex-wrap: wrap; gap: 32px; justify-content: space-between; align-items: flex-start; }
        .footer-brand { font-family: Georgia, serif; }
        .footer-brand .name { font-size: 20px; color: var(--gold); font-weight: 700; }
        .footer-brand .mark { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cinnabar); }
        .footer-links { display: flex; flex-wrap: wrap; gap: 24px; }
        .footer-links a { color: rgba(248,241,231,0.6); font-size: 14px; }
        .footer-links a:hover { color: var(--gold); text-decoration: none; }
        @media (max-width: 600px) { .strength-weakness { grid-template-columns: 1fr; } .fortune-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="topbar">
    <div class="container">
        <div class="topbar-inner">
            <div class="brand">
                <span class="brand-mark">Oriental Destiny</span>
                <span class="brand-name">Oriental Destiny</span>
            </div>
            <nav class="nav">
                {{TOPBAR_LINKS}}
            </nav>
        </div>
    </div>
</div>

<article>
    <header class="article-header">
        <div class="article-label">{{ARTICLE_LABEL}}</div>
        <h1>{{H1_TITLE}}</h1>
        <p style="font-size:18px; color:rgba(36,25,21,0.7); line-height:1.6;">{{LEAD_PARAGRAPH}}</p>
        <div class="article-meta">Estimated reading time: {{READING_TIME}} minutes</div>
    </header>

    <div class="article-body">
{{ARTICLE_BODY}}
    </div>
</article>

<footer>
    <div class="container">
        <div class="footer-inner">
            <div class="footer-brand">
                <div class="mark">Oriental Destiny</div>
                <div class="name">Oriental Destiny</div>
            </div>
            <div class="footer-links">
                {{FOOTER_LINKS}}
            </div>
        </div>
    </div>
</footer>

</body>
</html>
