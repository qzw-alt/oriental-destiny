/* ══════════════════════════════════════════════════════════
   水墨风 · Ink Wash Destiny Scroll
   命书查看器
   ══════════════════════════════════════════════════════════ */
:root {
  --ink: #1a1410;
  --ink-light: rgba(26,20,16,0.65);
  --ink-faint: rgba(26,20,16,0.35);
  --cinnabar: #b5342a;
  --cinnabar-deep: #8b1a14;
  --gold: #c9a24e;
  --gold-light: rgba(201,162,78,0.2);
  --gold-faint: rgba(201,162,78,0.08);
  --cream: #f5f0e8;
  --cream-dark: #ebe3d7;
  --paper: #faf7f1;
  --white: #fffdf8;
  --shadow-sm: 0 4px 20px rgba(26,20,16,0.06);
  --shadow: 0 12px 40px rgba(26,20,16,0.10);
  --shadow-lg: 0 24px 64px rgba(26,20,16,0.14);
  --radius: 8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body {
  font-family: 'Noto Serif SC', Georgia, 'STSong', serif;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 25% 8%, rgba(201,162,78,0.10) 0%, transparent 55%),
    radial-gradient(ellipse at 72% 92%, rgba(181,52,42,0.04) 0%, transparent 50%),
    linear-gradient(180deg, #f7f2e9 0%, var(--cream) 28%, var(--paper) 62%, #f5efe6 100%);
  line-height: 1.82;
  min-height: 100vh;
  overflow-x: hidden;
}

.container { max-width: 780px; margin: 0 auto; padding: 0 22px; }
a { color: inherit; text-decoration: none; }

/* ── Scroll progress ── */
.scroll-track {
  position: fixed; top: 0; left: 0; width: 100%; height: 3px; z-index: 9999;
  background: transparent; pointer-events: none;
}
.scroll-track .fill {
  height: 100%;
  background: linear-gradient(90deg, var(--cinnabar), var(--gold), var(--cinnabar));
  width: 0%; transition: width 0.15s linear;
}

/* ── Top bar ── */
.topbar {
  position: sticky; top: 0; z-index: 10;
  backdrop-filter: blur(14px);
  background: rgba(248,241,231,0.88);
  border-bottom: 1px solid rgba(26,20,16,0.08);
  padding: 14px 0;
}
.topbar-inner {
  max-width: 780px; margin: 0 auto; padding: 0 22px;
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
}
.brand { display: flex; flex-direction: column; gap: 1px; }
.brand-mark { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cinnabar); }
.brand-name { font-size: 18px; font-weight: 700; }

/* ── Chapter system ── */
.chapter {
  position: relative;
  margin-bottom: 20px;
  padding: 36px 0 16px;
  opacity: 0; transform: translateY(36px);
  animation: chapterEnter 0.9s cubic-bezier(0.22,0.61,0.36,1) forwards;
}
.chapter:nth-child(1){animation-delay:0s}
.chapter:nth-child(2){animation-delay:0.12s}
.chapter:nth-child(3){animation-delay:0.24s}
.chapter:nth-child(4){animation-delay:0.36s}
.chapter:nth-child(5){animation-delay:0.48s}
.chapter:nth-child(6){animation-delay:0.6s}
.chapter:nth-child(7){animation-delay:0.72s}

@keyframes chapterEnter {
  from { opacity: 0; transform: translateY(36px); }
  to   { opacity: 1; transform: translateY(0); }
}
.chapter-marker {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 24px;
}
.chapter-marker .vol {
  font-size: 11px; letter-spacing: 0.2em;
  color: var(--cinnabar); font-weight: 700;
  writing-mode: vertical-rl;
  background: rgba(181,52,42,0.06);
  padding: 8px 5px; border-radius: 2px;
}
.chapter-marker .title-cn {
  font-size: 24px; font-weight: 900; color: var(--ink);
  letter-spacing: 0.04em;
}

/* ── Content cards ── */
.content-card {
  background: var(--white);
  border-radius: 12px;
  padding: 30px 28px;
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(26,20,16,0.06);
}
.content-card p {
  color: var(--ink-light); margin-bottom: 12px;
  font-size: 15px; line-height: 1.9;
}
.content-card p:last-child { margin-bottom: 0; }

/* ── Hero cover ── */
.hero-cover {
  text-align: center;
  padding: 56px 0 46px;
  margin-bottom: 10px;
}
.seal-anim {
  display: inline-block;
  animation: sealStamp 1s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes sealStamp {
  0%   { transform: scale(2.8) rotate(-25deg); opacity: 0; }
  60%  { transform: scale(0.92) rotate(3deg); opacity: 1; }
  80%  { transform: scale(1.06) rotate(-2deg); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
.seal-inner {
  display: inline-flex; align-items: center; justify-content: center;
  width: 68px; height: 68px;
  border: 2.5px solid var(--cinnabar);
  border-radius: 4px;
  color: var(--cinnabar);
  font-size: 13px; font-weight: 900;
  letter-spacing: 0.12em;
  writing-mode: vertical-rl;
}
.hero-title {
  font-size: clamp(28px, 6vw, 42px);
  font-weight: 900;
  line-height: 1.25;
  margin: 20px 0 8px;
  letter-spacing: 0.03em;
}
.hero-title .em { color: var(--cinnabar); }
.hero-sub {
  font-size: 14px; color: var(--ink-light);
  margin-bottom: 8px;
}
.hero-divider {
  width: 80px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 0 auto 10px;
}

/* ── Bazi table ── */
.bazi-table {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 2px; margin: 16px 0;
}
.bazi-col {
  text-align: center;
  padding: 16px 8px 12px;
  background: linear-gradient(180deg, rgba(201,162,78,0.04) 0%, transparent 100%);
  border-radius: var(--radius);
  transition: transform 0.25s;
}
.bazi-col.day-master {
  background: linear-gradient(180deg, rgba(201,162,78,0.12) 0%, rgba(201,162,78,0.02) 100%);
  border: 1.5px solid var(--gold-light);
}
.bazi-col:hover { transform: translateY(-3px); box-shadow: var(--shadow-sm); }
.bazi-stem { display: block; font-size: 26px; font-weight: 900; color: var(--ink); }
.bazi-branch { display: block; font-size: 20px; font-weight: 700; color: var(--ink-light); margin-top: 2px; }
.bazi-label { display: block; font-size: 9px; color: var(--ink-faint); margin-top: 6px; letter-spacing: 0.06em; }
.bazi-nayin { display: block; font-size: 8px; color: var(--gold); margin-top: 2px; }
.bazi-dm {
  display: inline-block; margin-top: 3px;
  padding: 2px 8px; border-radius: 3px;
  background: var(--cinnabar); color: #fff;
  font-size: 9px; font-weight: 700;
}

/* ── Element bars ── */
.el-bar-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
}
.el-bar-label {
  font-size: 11px; width: 80px; text-align: right;
  color: var(--ink-light); font-family: 'Noto Sans SC', sans-serif;
}
.el-bar-track {
  flex: 1; height: 8px; background: rgba(26,20,16,0.06);
  border-radius: 4px; overflow: hidden;
}
.el-bar-fill {
  height: 100%; border-radius: 4px; transition: width 0.8s ease;
}
.el-bar-val {
  width: 44px; font-size: 11px; color: var(--ink-faint); flex-shrink: 0;
}

/* ── Chips ── */
.chip-row {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px;
}
.chip {
  display: inline-block; font-size: 10.5px; padding: 5px 13px;
  border-radius: 14px; font-weight: 600; letter-spacing: 0.04em;
  font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
}
.chip.gold { background: var(--gold-faint); color: #8a6d2f; }
.chip.red  { background: rgba(181,52,42,0.07); color: var(--cinnabar); }
.chip.green{ background: rgba(49,82,71,0.07); color: #315247; }

/* ── Upgrade CTA ── */
.upgrade-cta {
  text-align: center; margin: 40px 0 56px;
  padding: 40px 28px;
  background: linear-gradient(135deg, rgba(26,20,16,0.94), rgba(71,42,28,0.94)), var(--ink);
  border-radius: 12px;
  color: #fffdf8;
  box-shadow: var(--shadow-lg);
}
.upgrade-cta h2 { font-size: 24px; font-weight: 900; margin-bottom: 8px; color: #fff; }
.upgrade-cta p { color: rgba(255,253,248,0.78); font-size: 14px; margin-bottom: 20px; max-width: 500px; margin-left: auto; margin-right: auto; }
.upgrade-cta .cta-btn {
  display: inline-block;
  background: linear-gradient(135deg, var(--cinnabar), var(--cinnabar-deep));
  color: #fff; padding: 14px 32px; border-radius: var(--radius);
  font-size: 15px; font-weight: 700; letter-spacing: 0.04em;
  transition: all 0.2s;
  box-shadow: 0 6px 24px rgba(181,52,42,0.3);
}
.upgrade-cta .cta-btn:hover { transform: translateY(-2px); }
.upgrade-cta .credit-note { font-size: 12px; color: var(--gold); margin-top: 14px; }

/* ── Treasure cards ── */
.treasure-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0;
}
.treasure-card {
  background: var(--white);
  border: 1px solid rgba(26,20,16,0.06);
  border-radius: var(--radius);
  padding: 22px 18px; text-align: center;
  box-shadow: var(--shadow-sm);
}
.treasure-card.primary { border: 2px solid var(--gold-light); }
.treasure-card .icon { font-size: 32px; margin-bottom: 8px; }
.treasure-card .name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.treasure-card .fit { font-size: 12px; color: var(--ink-faint); }

/* ── Loading & Error ── */
.loading-state {
  text-align: center; padding: 80px 20px;
}
.loading-spinner {
  display: inline-block; width: 40px; height: 40px;
  border: 3px solid rgba(181,52,42,0.15);
  border-top-color: var(--cinnabar);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-state {
  text-align: center; padding: 60px 20px;
}
.error-state h2 { margin-bottom: 12px; color: var(--cinnabar); }

.btn-link {
  display: inline-block; padding: 12px 28px; border-radius: var(--radius);
  background: linear-gradient(135deg, var(--cinnabar), var(--cinnabar-deep));
  color: #fff; font-size: 14px; font-weight: 600; transition: all 0.2s;
}
.btn-link:hover { transform: translateY(-1px); }

footer { text-align: center; padding: 24px 20px; font-size: 12px; color: var(--ink-faint); border-top: 1px solid rgba(26,20,16,0.06); }
footer a { color: var(--cinnabar); }

@media (max-width: 600px) {
  .bazi-table { grid-template-columns: repeat(2, 1fr); }
  .content-card { padding: 22px 18px; }
  .treasure-grid { grid-template-columns: 1fr; }
}
</style>

<script>
(function() {
    var params = new URLSearchParams(window.location.search);
    var reportId = params.get('reportId');

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function paras(text) {
      if (!text) return '';
      return String(text).split(/\n\n/).filter(Boolean)
        .map(function(pp){return '<p>'+esc(pp).replace(/\n/g,'<br>')+'</p>';}).join('\n');
    }

    var elColors = {Wood:'#4a7c59',Fire:'#b5342a',Earth:'#c9a24e',Metal:'#8a8a8a',Water:'#2c3e6b'};
    var elChinese = {Wood:'木',Fire:'火',Earth:'土',Metal:'金',Water:'水'};
    var elNames = ['Wood','Fire','Earth','Metal','Water'];

    function showError(msg) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('errorState').style.display = '';
        if (msg) document.getElementById('errorMsg').textContent = msg;
    }

    function showReport() {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('reportContent').style.display = '';
    }

    // Scroll progress
    window.addEventListener('scroll', function() {
        var h = document.documentElement;
        var pct = h.scrollHeight - h.clientHeight > 0
            ? Math.round((h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100)
            : 0;
        document.getElementById('scrollFill').style.width = pct + '%';
    });

    // Init engine
    var engine = new ReportEngineV2({
        proxyBaseURL: (typeof window.DEEPSEEK_PROXY_URL === 'string' && window.DEEPSEEK_PROXY_URL)
            ? window.DEEPSEEK_PROXY_URL : null
    });

    function init() {
        // If reportId, load from Firestore
        if (reportId) {
            Auth.init().then(function() {
                if (!Auth.currentUser) {
                    showError('请登录查看已保存的命书。');
                    return;
                }
                return Auth.getInstantReport(reportId).then(function(data) {
                    if (!data || !data.reportContent) {
                        showError('命书未找到。可能已被删除。');
                        return;
                    }
                    renderFromSaved(data);
                });
            }).catch(function() {
                showError('加载失败，请重试。');
            });
            return;
        }

        // New report from ReadingState
        var state = {};
        try { if (window.ReadingState) state = window.ReadingState.read(); } catch(e) {}

        if (!state.birth_date) {
            showError('未找到出生信息。请从免费诊断开始。');
            return;
        }

        generateReport(state);
    }

    function generateReport(state) {
        var profile;
        try {
            profile = window.BaziEngineV2.calculateProfile({
                birthDate: state.birth_date,
                birthTime: state.birth_time || undefined,
                lifeFocus: state.focus || 'balance',
                gender: state.gender || undefined
            });
        } catch(e) {
            showError('排盘失败: ' + e.message);
            return;
        }

        engine.generateBasicReport(profile, state.focus || 'balance').then(function(basic) {
            var r = basic.report;
            var sn = basic.chartSnapshot || window.buildChartSnapshot(profile);

            // Cover
            var dm = profile.dayMaster, dmEl = profile.dayMasterElement;
            document.getElementById('coverContent').innerHTML =
                '<div class="seal-anim"><div class="seal-inner">'+esc(dm)+esc(dmEl)+'</div></div>' +
                '<h1 class="hero-title">'+esc(dm)+'<span class="em">'+esc(dmEl)+'</span> · 命主</h1>' +
                '<p class="hero-sub">'+esc(sn.fourPillars.year)+' · '+esc(sn.fourPillars.month)+' · '+esc(sn.fourPillars.day)+' · '+esc(sn.fourPillars.hour)+'</p>' +
                '<div class="hero-divider"></div>' +
                '<p style="font-size:12px;color:var(--ink-faint);">格局: '+esc(sn.pattern)+' · 用神: '+esc(sn.yongShen)+' · '+esc(sn.strength)+'</p>';

            // 卷一
            document.getElementById('sec1').innerHTML = paras(r.opening || '');

            // 卷二
            document.getElementById('sec2').innerHTML = paras(r.yourPattern || '');

            // 卷三
            document.getElementById('sec3').innerHTML = paras(r.whatGuidesYou || '');

            // 卷四 - Practical steps
            var stepsHTML = '';
            if (r.practicalSteps && r.practicalSteps.length) {
                stepsHTML = '<ul style="list-style:none;display:grid;gap:12px;">';
                r.practicalSteps.forEach(function(s, i) {
                    stepsHTML += '<li style="display:flex;align-items:flex-start;gap:14px;padding:16px 18px;background:var(--gold-faint);border-radius:var(--radius);border-left:3px solid var(--gold);">' +
                        '<span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--cinnabar);color:#fff;font-size:12px;font-weight:700;flex-shrink:0;">'+(i+1)+'</span>' +
                        '<span style="font-size:14px;color:var(--ink-light);">'+esc(s)+'</span></li>';
                });
                stepsHTML += '</ul>';
            }
            document.getElementById('sec4').innerHTML = stepsHTML;

            // 卷五 - Element bars + chart data
            var elCounts = profile.elementCounts || {};
            var maxCount = Math.max(1, elNames.map(function(e){return elCounts[e]||0;}).reduce(function(a,b){return Math.max(a,b);},0));
            var barsHTML = '<div style="padding:10px 0;">';
            elNames.forEach(function(e) {
                var pct = Math.round(((elCounts[e]||0) / maxCount) * 100);
                barsHTML += '<div class="el-bar-row">' +
                    '<span class="el-bar-label">'+elChinese[e]+' '+e+'</span>' +
                    '<span class="el-bar-track"><span class="el-bar-fill" style="width:'+pct+'%;background:'+elColors[e]+'"></span></span>' +
                    '<span class="el-bar-val">'+(elCounts[e]||0).toFixed(1)+'</span></div>';
            });
            barsHTML += '</div>';
            barsHTML += '<p style="font-size:13px;color:var(--ink-faint);margin-top:10px;text-align:center;">' +
                '用神: '+esc(sn.yongShen)+' · 喜神: '+esc(sn.xiShen)+' · 忌神: '+esc(sn.jiShen)+' · 起运: '+esc(sn.qiYun)+' · 当前大运: '+esc(sn.currentDaYun)+'</p>';

            document.getElementById('sec5').innerHTML = barsHTML;

            // Update upgrade link
            var q = window.ReadingState ? window.ReadingState.toQuery(state) : '';
            document.getElementById('upgradeBtn').href = 'checkout.html?' + q;

            showReport();
        }).catch(function(e) {
            showError('生成失败: ' + (e.message || ''));
        });
    }

    function renderFromSaved(data) {
        showReport();
        document.getElementById('coverContent').innerHTML =
            '<h1 class="hero-title">你的<span class="em">命书</span></h1>' +
            '<p class="hero-sub">'+esc(data.birthDate||'')+(data.birthTime?' · '+esc(data.birthTime):'')+' · '+esc(data.lifeFocus||'')+'</p>';

        if (data.reportContent) {
            try {
                var content = typeof data.reportContent === 'string' ? JSON.parse(data.reportContent) : data.reportContent;
                document.getElementById('sec1').innerHTML = content.dayMaster || '';
                document.getElementById('sec2').innerHTML = content.elements || '';
                document.getElementById('sec3').innerHTML = content.focus || '';
                document.getElementById('sec4').innerHTML = content.support || '';
                document.getElementById('sec5').innerHTML = content.treasure || '';
            } catch(e) {}
        }
    }

    init();
})();
</script>
</body>
</html>
